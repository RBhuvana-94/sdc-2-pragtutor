<!DOCTYPE html>
<html>
<head>
  <title>LiveQuiz+</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
    /* Loading the Poppins font (weights 600 and 700) from Google Fonts so we can use it in your webpage.” */

    body {
      margin:0; padding:0; height:100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display:flex; align-items:center; justify-content:center;
      font-family:'Poppins',sans-serif;
    }
    .box { background:white; padding:50px; border-radius:25px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
    h1 { font-size:48px; color:#4f46e5; margin-bottom:40px; }
    button {
      padding:18px 40px; margin:15px; font-size:20px; border:none; border-radius:15px; cursor:pointer; width:220px;
    }
    .teacher { background:#4f46e5; color:white; }
    .student { background:#10b981; color:white; }
  </style>
</head>
<body>
  <div class="box">
    <h1>LiveQuiz+</h1>
    <button class="teacher" onclick="localStorage.setItem('role','teacher');location.href='register.html'">Teacher</button><br>
    <button class="student" onclick="localStorage.setItem('role','student');location.href='register.html'">Student</button>
    <!-- localStorage is useful because it remembers data even after closing the tab or browser, unlike temporary storage. -->
  </div>
</body>
</html>
