<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Dashboard - LiveQuiz+</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .monitoring-container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .metric-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .metric-value {
      font-size: 48px;
      font-weight: bold;
      color: #8b46ff;
      margin: 10px 0;
    }
    .metric-label {
      color: #666;
      font-size: 16px;
    }
    .chart-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin: 30px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-healthy { background: #10b981; }
    .status-warning { background: #f59e0b; }
    .status-error { background: #ef4444; }
    .refresh-btn {
      background: #8b46ff;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body class="dashboard">
  <div class="monitoring-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
      <h1 style="font-size:42px; background:linear-gradient(135deg,#8b46ff,#5e42ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
        System Monitoring
      </h1>
      <button class="refresh-btn" onclick="loadMetrics()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Active Quizzes</div>
        <div class="metric-value" id="activeQuizzes">0</div>
        <div><span class="status-indicator status-healthy"></span>System Healthy</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">WebSocket Connections</div>
        <div class="metric-value" id="activeConnections">0</div>
        <div><span class="status-indicator status-healthy"></span>Connected</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Total Requests</div>
        <div class="metric-value" id="totalRequests">0</div>
        <div><span class="status-indicator status-healthy"></span>Active</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Avg Response Time</div>
        <div class="metric-value" id="avgResponseTime">0ms</div>
        <div><span class="status-indicator status-healthy"></span>Optimal</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Cache Hit Rate</div>
        <div class="metric-value" id="cacheHitRate">0%</div>
        <div><span class="status-indicator status-healthy"></span>Good</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Background Tasks</div>
        <div class="metric-value" id="backgroundTasks">0</div>
        <div><span class="status-indicator status-healthy"></span>Running</div>
      </div>
    </div>

    <div class="chart-container">
      <h2>Response Time Trend</h2>
      <canvas id="responseTimeChart"></canvas>
    </div>

    <div class="chart-container">
      <h2>Request Rate</h2>
      <canvas id="requestRateChart"></canvas>
    </div>

    <div class="chart-container">
      <h2>System Health</h2>
      <div id="healthStatus"></div>
    </div>
  </div>

  <script>
    let responseTimeChart, requestRateChart;
    let metricsData = {
      responseTimes: [],
      requestRates: [],
      timestamps: []
    };

    async function loadMetrics() {
      try {
        // Fetch Prometheus metrics
        const metricsRes = await fetch('/metrics');
        const metricsText = await metricsRes.text();
        
        // Parse metrics (simplified - in production use proper parser)
        parseMetrics(metricsText);

        // Fetch performance summary from FastAPI
        try {
          const token = localStorage.getItem('token');
          const perfRes = await fetch('http://localhost:8000/api/metrics/summary', {
            headers: {
              'Authorization': 'Bearer ' + token
            }
          });
          if (perfRes.ok) {
            const perf = await perfRes.json();
            document.getElementById('avgResponseTime').textContent = 
              (perf.avg_response_time * 1000).toFixed(0) + 'ms';
          }
          
        } catch (e) {
          console.log('FastAPI not available');
        }
         updateCharts();
    updateSystemHealth();
      } catch (error) {
        console.error('Error loading metrics:', error);
      }
    }

    function parseMetrics(metricsText) {
      const lines = metricsText.split('\n');
      
      lines.forEach(line => {
        if (line.startsWith('active_quizzes_total')) {
          const match = line.match(/active_quizzes_total\s+(\d+)/);
          if (match) {
            document.getElementById('activeQuizzes').textContent = match[1];
          }
        }
        if (line.startsWith('websocket_connections_total')) {
          const match = line.match(/websocket_connections_total\s+(\d+)/);
          if (match) {
            document.getElementById('activeConnections').textContent = match[1];
          }
        }
        if (line.startsWith('http_requests_total')) {
          const match = line.match(/http_requests_total.*\s+(\d+)/);
          if (match) {
            document.getElementById('totalRequests').textContent = match[1];
          }
        }
      });
    }

    function updateSystemHealth() {
  const activeQuizzes = parseInt(document.getElementById('activeQuizzes').textContent);
  const activeConnections = parseInt(document.getElementById('activeConnections').textContent);
  const totalRequests = parseInt(document.getElementById('totalRequests').textContent);
  const avgResponseTime = parseInt(document.getElementById('avgResponseTime').textContent); // in ms
  const cacheHitRate = parseInt(document.getElementById('cacheHitRate').textContent);

  let statusText = 'Healthy';
  let statusColor = '#10b981'; // green

  // Simple rules for system health
  if (activeConnections === 0 || totalRequests === 0) {
    statusText = 'Error';
    statusColor = '#ef4444'; // red
  } else if (avgResponseTime > 500 || cacheHitRate < 50) {
    statusText = 'Warning';
    statusColor = '#f59e0b'; // yellow/orange
  }

  document.getElementById('healthStatus').innerHTML = `
    <span class="status-indicator" style="background:${statusColor}"></span> ${statusText}
  `;
}


    function updateCharts() {
      const now = new Date();
      const timestamp = now.toLocaleTimeString();
      
      // Add sample data (in production, use real metrics)
      metricsData.timestamps.push(timestamp);
      metricsData.responseTimes.push(Math.random() * 200 + 50);
      metricsData.requestRates.push(Math.random() * 10 + 5);

      // Keep only last 20 data points
      if (metricsData.timestamps.length > 20) {
        metricsData.timestamps.shift();
        metricsData.responseTimes.shift();
        metricsData.requestRates.shift();
      }

      // Update response time chart
      if (!responseTimeChart) {
        const ctx1 = document.getElementById('responseTimeChart').getContext('2d');
        responseTimeChart = new Chart(ctx1, {
          type: 'line',
          data: {
            labels: metricsData.timestamps,
            datasets: [{
              label: 'Response Time (ms)',
              data: metricsData.responseTimes,
              borderColor: '#8b46ff',
              backgroundColor: 'rgba(139, 70, 255, 0.1)',
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true }
            }
          }
        });
      } else {
        responseTimeChart.data.labels = metricsData.timestamps;
        responseTimeChart.data.datasets[0].data = metricsData.responseTimes;
        responseTimeChart.update();
      }

      // Update request rate chart
      if (!requestRateChart) {
        const ctx2 = document.getElementById('requestRateChart').getContext('2d');
        requestRateChart = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: metricsData.timestamps,
            datasets: [{
              label: 'Requests/sec',
              data: metricsData.requestRates,
              backgroundColor: '#10b981'
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true }
            }
          }
        });
      } else {
        requestRateChart.data.labels = metricsData.timestamps;
        requestRateChart.data.datasets[0].data = metricsData.requestRates;
        requestRateChart.update();
      }
    }

    // Load metrics on page load and refresh every 5 seconds
    loadMetrics();
    setInterval(loadMetrics, 5000);
  </script>
</body>
</html>
