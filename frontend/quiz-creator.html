<!DOCTYPE html>
<html>
<head>
  <title>Create Quiz - LiveQuiz+</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .creator-container {
      max-width: 1000px; margin: 40px auto; padding: 0 20px;
    }
    .title-input {
      width: 100%; padding: 20px; font-size: 28px; border: 3px solid #e0e0e0; border-radius: 20px;
      margin-bottom: 30px; font-weight: 600; color: #333;
    }
    .title-input:focus { border-color: #8b46ff; outline: none; }

    .question-block {
      background: white; border-radius: 24px; padding: 30px; margin-bottom: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 2px solid #f0f0ff;
    }
    .question-block:hover { border-color: #8b46ff; }

    .q-input { width:100%; padding:18px; font-size:18px; border:2px solid #e0e0e0; border-radius:16px; margin:12px 0; }
    .q-input:focus { border-color:#8b46ff; outline:none; }

    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0;
    }
    .option-input {
      padding: 16px; border: 2px solid #e0e0e0; border-radius: 16px; font-size: 16px;
    }

    .correct-select {
      padding: 16px; border-radius: 16px; border: 2px solid #e0e0e0; font-size: 16px; margin: 15px 0;
    }

    .image-preview {
      margin-top: 15px; text-align: center;
    }
    .image-preview img {
      max-width: 100%; max-height: 300px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .btn-add { 
      background: linear-gradient(135deg,#10b981,#059669); color:white; padding:16px 32px; 
      border:none; border-radius:16px; font-size:18px; cursor:pointer; margin:20px 0;
    }
    .btn-save {
      background: linear-gradient(135deg,#8b46ff,#5e42ff); color:white; padding:20px 50px;
      border:none; border-radius:20px; font-size:22px; font-weight:600; cursor:pointer;
      box-shadow:0 15px 40px rgba(139,70,255,0.4);
    }
    .btn-save:hover, .btn-add:hover { transform:translateY(-5px); }

    .remove-btn {
      background:#ef4444; color:white; padding:10px 20px; border:none; border-radius:12px; cursor:pointer;
    }
  </style>
</head>
<body class="dashboard">
  <div style="margin: 1px auto; padding:40px; transition:0.4s;">
    <div class="creator-container">
      <h1 style="font-size:38px; color:#5e42ff; text-align:center; margin-bottom:20px;">Create New Quiz</h1>
      <input type="text" id="title" class="title-input" placeholder="Enter Quiz Title">

      <div id="questions"></div>

      <div style="text-align:center;">
        <button class="btn-add" onclick="addQuestion()">+ Add Question</button>
      </div>

      <div style="text-align:center; margin:50px 0;">
        <button class="btn-save" onclick="saveQuiz()">Save & Get Code</button>
        <div id="result" style="margin-top:30px; font-size:24px;"></div>
      </div>
    </div>
  </div>
  <script>
    
    let questionCount = 0;
    function addQuestion() {
      questionCount++;
      const div = document.createElement('div');
      div.className = 'question-block';
      div.innerHTML = `
        <h2 style="color:#5e42ff; margin-bottom:20px;">Question ${questionCount}</h2>
        <input type="text" class="q-input qtext" placeholder="Question Text">
        
        <div class="options-grid">
          <input type="text" class="option-input" placeholder="Option 1">
          <input type="text" class="option-input" placeholder="Option 2">
          <input type="text" class="option-input" placeholder="Option 3">
          <input type="text" class="option-input" placeholder="Option 4">
        </div>

        <select class="correct-select">
          <option value="0">Correct Answer: Option 1</option>
          <option value="1">Correct Answer: Option 2</option>
          <option value="2">Correct Answer: Option 3</option>
          <option value="3">Correct Answer: Option 4</option>
        </select>

        <input type="file" accept="image/*" class="qimage" style="margin:15px 0;">
        <div class="image-preview"></div>

        <button class="remove-btn" onclick="this.parentElement.remove()">Remove Question</button>
      `;

      div.querySelector('.qimage').onchange = function(e) {
        if (e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = ev => div.querySelector('.image-preview').innerHTML = `<img src="${ev.target.result}">`;
          reader.readAsDataURL(e.target.files[0]);
        }
      };

      document.getElementById('questions').appendChild(div);
    }

    async function saveQuiz() {
      const title = document.getElementById('title').value.trim();
      if (!title) {
        alert('Please enter a quiz title!');
        return;
      }

      const questionBlocks = document.querySelectorAll('.question-block');
      if (questionBlocks.length === 0) {
        alert('Please add at least one question!');
        return;
      }

      const questions = [];
      const formData = new FormData();
      formData.append('title', title);

      for (let i = 0; i < questionBlocks.length; i++) {
        const block = questionBlocks[i];
        const text = block.querySelector('.qtext').value.trim();
        const options = Array.from(block.querySelectorAll('.option-input')).map(inp => inp.value.trim()).filter(o => o);
        const correct = parseInt(block.querySelector('.correct-select').value);
        const imageFile = block.querySelector('.qimage').files[0];

        if (!text || options.length < 2) {
          alert(`Question ${i + 1} is incomplete!`);
          return;
        }

        if (imageFile) {
          formData.append('images', imageFile);
        }

        questions.push({ text, options, correct });
      }

      formData.append('questions', JSON.stringify(questions));

      try {
        const token = sessionStorage.getItem('token') || localStorage.getItem('token');
        if (!token) {
          alert('Please login first!');
          location.href = 'login.html';
          return;
        }

        const res = await fetch('/api/quiz/create', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          document.getElementById('result').innerHTML = `
            <div style="background:#10b981; color:white; padding:30px; border-radius:24px; font-size:28px; font-weight:bold; display:inline-block;">
              Quiz Created! Code: <span style="letter-spacing:8px; font-size:36px;">${data.code}</span>
            </div>
            <p style="margin-top:20px; font-size:18px; color:#333;">Share this code with students!</p>
            <button onclick="location.href='teacher-quiz.html?code=${data.code}'" style="background:#8b46ff; color:white; border:none; padding:16px 40px; border-radius:16px; font-size:18px; cursor:pointer; margin-top:20px;">
              Start Hosting Quiz
            </button>
          `;
        } else {
          alert(data.error || 'Failed to create quiz');
        }
      } catch (error) {
        console.error('Error creating quiz:', error);
        alert('Failed to create quiz. Please try again.');
      }
    }

    // Add first question automatically
    addQuestion();
  </script>
</body>
</html>
