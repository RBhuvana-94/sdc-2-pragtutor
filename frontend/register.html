<!DOCTYPE html>
<html>
<head>
  <title>Register - LiveQuiz+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 { color: #4f46e5; margin-bottom: 30px; font-size: 32px; }
    input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: 0.3s;
    }
    input:focus { border-color: #4f46e5; outline: none; }
    .role-toggle {
      display:flex;
      gap:12px;
      margin-bottom:20px;
    }
    .role-toggle button {
      flex:1;
      padding:12px;
      border:2px solid #e0e0e0;
      border-radius:12px;
      background:white;
      color:#4f46e5;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }
    .role-toggle button.active {
      background:#4f46e5;
      color:white;
      border-color:#4f46e5;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #4338ca; }
    .link { margin-top: 20px; }
    .link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    .msg { margin-top: 15px; font-weight: bold; }
    .password-wrapper {
  position: relative;
}

  .password-wrapper input {
    width: 100%;
    padding: 15px;
    padding-right: 50px; /* space for the eye */
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
  }

  .toggle-eye {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #666;
  }

  </style>
</head>
<body>

<div class="card">
  <h1>Create Account</h1>
  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Email Address" required pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="Enter a valid Gmail address">
  <div class="password-wrapper">
  <input type="password" id="password" placeholder="Password" required>
  <span class="toggle-eye" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="register()">Register</button>
  
  <div class="link">
    Have account? <a href="login.html">Login here</a>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
const roleButtons = document.querySelectorAll('.role-toggle button');
let selectedRole = localStorage.getItem('role') || 'student';

roleButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedRole = btn.dataset.role;
    localStorage.setItem('role', selectedRole);
    roleButtons.forEach(b => b.classList.toggle('active', b === btn));
  });
  if (btn.dataset.role === selectedRole) {
    btn.classList.add('active');
  }
});

async function register() {
  const name = document.getElementById('name').value.trim() || "Student";
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!email || !password) return msg.innerHTML = "<span style='color:red;'>Fill all fields!</span>";

  const gmailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
  if (!gmailPattern.test(email.toLowerCase())) {
    return msg.innerHTML = "<span style='color:red;'>Enter a valid Gmail address</span>";
  }

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role: selectedRole })
    });

    const data = await res.json();

    if (data.success) {
      msg.innerHTML = "<span style='color:green;'>Success! Redirecting...</span>";
      setTimeout(() => location.href = 'login.html', 1000);
    } else {
      msg.innerHTML = `<span style='color:red;'>${data.error || "Try again"}</span>`;
    }
  } catch (err) {
    msg.innerHTML = "<span style='color:red;'>Check if server is running!</span>";
  }
}

function togglePassword() {
  const pwd = document.getElementById('password');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
