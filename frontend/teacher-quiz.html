<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host Quiz - LiveQuiz+</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .quiz-host-container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
    }
    .quiz-code-display {
      background: linear-gradient(135deg, #8b46ff, #5e42ff);
      color: white;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      margin-bottom: 30px;
    }
    .quiz-code-display h1 {
      font-size: 72px;
      letter-spacing: 20px;
      margin: 20px 0;
    }
    .question-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .question-item {
      background: #f8f9ff;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      transition: 0.3s;
    }
    .question-item:hover {
      border-color: #8b46ff;
    }
    .question-item.live {
      border-color: #10b981;
      background: #f0fdf4;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .question-number {
      font-size: 24px;
      font-weight: bold;
      color: #8b46ff;
    }
    .question-text {
      font-size: 20px;
      color: #333;
      margin: 15px 0;
      font-weight: 600;
    }
    .question-options {
      margin: 15px 0;
    }
    .option-item {
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      border-left: 4px solid #e0e0e0;
    }
    .option-item.correct {
      border-left-color: #10b981;
      background: #f0fdf4;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-edit {
      background: #8b46ff;
      color: white;
    }
    .btn-live {
      background: #0ea5e9;
      color: white;
    }
    .btn-delete {
      background: #ef4444;
      color: white;
    }
    .btn-add {
      background: #10b981;
      color: white;
      padding: 16px 40px;
      font-size: 18px;
      margin: 20px 0;
    }
    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 20px 60px;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 30px 0;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    }
    .btn-end {
      background: #ef4444;
      color: white;
      padding: 16px 40px;
      font-size: 18px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 30px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .stat-card {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }
    .stat-number {
      font-size: 48px;
      font-weight: bold;
      color: #8b46ff;
    }
    .scoreboard-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .scoreboard-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 18px;
      background: #f8f9ff;
      border-radius: 14px;
      border: 1px solid #e0e0e0;
    }
    .scoreboard-row.top {
      background: #f0fdf4;
      border-color: #10b981;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal input, .modal textarea, .modal select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
    }
    .modal textarea {
      min-height: 100px;
      resize: vertical;
    }
    .option-input-group {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }
    .option-input-group input {
      flex: 1;
    }
  </style>
</head>
<body class="dashboard">
  <div class="quiz-host-container">
    <div class="quiz-code-display">
      <h2>Quiz Code</h2>
      <h1 id="quizCodeDisplay">LOADING...</h1>
      <p>Share this code with students to join</p>
    </div>

    <div class="question-card">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="participantsCount">0</div>
          <div>Live Participants</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="responsesCount">0</div>
          <div>Responses</div>
        </div>
      </div>

      <div class="question-card" style="margin-top:30px;">
        <h2 style="font-size:24px; color:#333; margin-bottom:15px;">Live Participants</h2>
        <div id="participantsList" style="display:flex; flex-direction:column; gap:10px;">
          <p style="text-align:center; color:#666;">No participants yet.</p>
        </div>
      </div>

      <div style="text-align:center;">
        <button class="btn-start" id="startQuizBtn" onclick="startQuiz()">
          <i class="fas fa-play"></i> Start Quiz
        </button>
        <div id="quizStarted" style="display:none;">
          <p style="font-size:20px; color:#10b981; font-weight:bold;">Quiz is Live!</p>
        </div>
      </div>
    </div>

    <div class="question-card">
      <h2 style="font-size:28px; color:#333; margin-bottom:10px;">Live Scoreboard</h2>
      <div id="scoreboardList" class="scoreboard-list">
        <p style="text-align:center; color:#666;">No answers yet.</p>
      </div>
    </div>

    <div class="question-card">
      <h2 style="font-size:32px; color:#333; margin-bottom:20px;">Quiz Questions</h2>
      <div id="questionsList"></div>
      <div style="text-align:center;">
        <button class="btn btn-add" onclick="openAddQuestionModal()">
          <i class="fas fa-plus"></i> Add Question
        </button>
      </div>
      <div style="text-align:center; margin-top:30px;">
        <button class="btn-end" onclick="endQuiz()">
          <i class="fas fa-stop"></i> End Quiz
        </button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Question Modal -->
  <div id="questionModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Question</h2>
      <input type="text" id="modalQuestionText" placeholder="Question Text">
      <div id="modalOptions">
        <div class="option-input-group">
          <input type="text" class="option-input" placeholder="Option 1">
          <input type="radio" name="correctOption" value="0">
        </div>
        <div class="option-input-group">
          <input type="text" class="option-input" placeholder="Option 2">
          <input type="radio" name="correctOption" value="1">
        </div>
        <div class="option-input-group">
          <input type="text" class="option-input" placeholder="Option 3">
          <input type="radio" name="correctOption" value="2">
        </div>
        <div class="option-input-group">
          <input type="text" class="option-input" placeholder="Option 4">
          <input type="radio" name="correctOption" value="3">
        </div>
      </div>
      <button class="btn btn-add" onclick="addOptionInput()" style="margin:10px 0;">Add Option</button>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-add" onclick="saveQuestion()" style="flex:1;">Save</button>
        <button class="btn" onclick="closeModal()" style="background:#666; color:white; flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const quizCode = urlParams.get('code');
    const authToken = sessionStorage.getItem('token') || localStorage.getItem('token');
    let questions = [];
    let participantCount = 0;
    let responses = {};
    let editingQuestionIndex = null;
    let quizStarted = false;
    let currentLiveQuestion = -1;
    let liveLeaderboard = [];
    let liveParticipants = [];

    // Initialize Socket.IO with better error handling
    console.log('🔌 Teacher: Initializing WebSocket connection...');
    const socket = io({
      transports: ['websocket', 'polling'],
      reconnection: true
    });

    // Listen for quiz data syncs from server
    socket.on('quizData', ({ code, title, questions: serverQuestions, active, currentQuestionIndex }) => {
      console.log('📥 Received quiz data sync from server:', serverQuestions);
      questions = serverQuestions || [];
      quizStarted = typeof currentQuestionIndex === 'number' && currentQuestionIndex >= 0;
      currentLiveQuestion = quizStarted ? currentQuestionIndex : -1;

      if (quizStarted) {
        document.getElementById('startQuizBtn').style.display = 'none';
        document.getElementById('quizStarted').style.display = 'block';
      }

      document.getElementById('quizCodeDisplay').textContent = code || quizCode;
      renderQuestions();
    });


    socket.on('connect', () => {
      console.log('✅ Teacher: WebSocket connected! Socket ID:', socket.id);
      console.log('📥 Teacher: Joining quiz room:', quizCode);
      socket.emit('joinQuizRoom', { code: quizCode, token: authToken });
    });

    socket.on('connect_error', (error) => {
      console.error('❌ Teacher: WebSocket connection error:', error);
    });

    socket.on('roomJoined', (data) => {
      console.log('✅ Teacher: Successfully joined room:', data.code);
    });

    socket.on('answerReceived', ({ userId, studentName, score }) => {
      responses.total = (responses.total || 0) + 1;
      updateStats();
    });

    socket.on('scoreboardUpdated', ({ leaderboard }) => {
      liveLeaderboard = leaderboard || [];
      renderScoreboard();
    });

    socket.on('participantCountUpdated', ({ count, participants }) => {
      if (typeof count === 'number') {
        participantCount = count;
        updateStats();
      }
    });

    socket.on('participantsListUpdated', ({ participants }) => {
      liveParticipants = participants || [];
      renderParticipantsList();
    });

    socket.on('responseCountUpdated', ({ count }) => {
      responses.total = count;
      updateStats();
    });

    socket.on('quizStarted', (data) => {
      console.log('📥 Quiz started event received:', data);
      quizStarted = true;
      document.getElementById('startQuizBtn').style.display = 'none';
      document.getElementById('quizStarted').style.display = 'block';
      if (data.questions) {
        questions = data.questions;
        renderQuestions();
      }
    });

    socket.on('questionUpdated', (data) => {
      // Update question in list if it was modified
      if (data.type === 'updated' && data.questionIndex !== undefined) {
        questions[data.questionIndex] = data.question;
        renderQuestions();
      } else if (data.type === 'deleted' && data.questionIndex !== undefined) {
        questions.splice(data.questionIndex, 1);
        renderQuestions();
      } else if (data.type === 'added' && data.question) {
        questions.push(data.question);
        renderQuestions();
      }
    });

    async function loadQuiz() {
      try {
        const token = authToken;
        const res = await fetch(`/api/quiz/${quizCode}/data`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (!res.ok) {
          alert('Quiz not found');
          location.href = 'teacher-dashboard.html';
          return;
        }
        
        const quizData = await res.json();
        questions = quizData.questions || [];
        quizStarted = quizData.currentQuestionIndex >= 0;
        currentLiveQuestion = quizData.currentQuestionIndex ?? -1;
        
        document.getElementById('quizCodeDisplay').textContent = quizCode;
        
        if (quizStarted) {
          document.getElementById('startQuizBtn').style.display = 'none';
          document.getElementById('quizStarted').style.display = 'block';
        }
        
        // Load participants
        const participantsRes = await fetch(`/api/quiz/${quizCode}/participants`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (participantsRes.ok) {
          const parts = await participantsRes.json();
          participantCount = parts.length;
          liveParticipants = parts;
          renderParticipantsList();
        }
        
        renderQuestions();
        updateStats();
        await loadLeaderboard();
        
        // Load response count
        const leaderboardRes = await fetch(`/api/quiz/${quizCode}/leaderboard`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (leaderboardRes.ok) {
          const leaderboard = await leaderboardRes.json();
          responses.total = leaderboard.length;
          updateStats();
        }
      } catch (error) {
        console.error('Error loading quiz:', error);
      }
    }

    function renderQuestions() {
      const list = document.getElementById('questionsList');
      if (questions.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">No questions yet. Add your first question!</p>';
        return;
      }

      list.innerHTML = questions.map((q, index) => `
        <div class="question-item ${index === currentLiveQuestion ? 'live' : ''}">
          <div class="question-header">
            <span class="question-number">Question ${index + 1}</span>
            <div class="btn-group">
              <button class="btn btn-edit" onclick="openEditQuestionModal(${index})">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn btn-delete" onclick="deleteQuestion(${index})">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>
          <div class="question-text">${q.text || q.question}</div>
          <div class="question-options">
            ${q.options.map((opt, optIdx) => `
              <div class="option-item ${optIdx === q.correct ? 'correct' : ''}">
                ${optIdx === q.correct ? '✓ ' : ''}${opt}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function startQuiz() {
      if (questions.length === 0) {
        alert('Please add at least one question before starting!');
        return;
      }

      if (!confirm('Start the quiz? Students will be able to see the first question.')) return;

      try {
        const token = authToken;
        
        // Update database first (this will also broadcast via server)
        const res = await fetch(`/api/quiz/${quizCode}/start`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ questionIndex: 0 })
        });

        if (res.ok) {
          quizStarted = true;
          document.getElementById('startQuizBtn').style.display = 'none';
          document.getElementById('quizStarted').style.display = 'block';
          alert('Quiz started! Students can now see the first question.');
          console.log('✅ Quiz started successfully!');
        } else {
          const errorData = await res.json();
          alert(errorData.error || 'Failed to start quiz');
          console.error('❌ Failed to start quiz:', errorData);
        }
      } catch (error) {
        console.error('Error starting quiz:', error);
        alert('Failed to start quiz');
      }
    }

    function openAddQuestionModal() {
      editingQuestionIndex = null;
      document.getElementById('modalTitle').textContent = 'Add Question';
      document.getElementById('modalQuestionText').value = '';
      document.querySelectorAll('.option-input').forEach((inp, idx) => {
        inp.value = '';
        if (idx === 0) inp.closest('.option-input-group').querySelector('input[type="radio"]').checked = true;
        else inp.closest('.option-input-group').querySelector('input[type="radio"]').checked = false;
      });
      document.getElementById('questionModal').style.display = 'flex';
    }

    function openEditQuestionModal(index) {
      editingQuestionIndex = index;
      const q = questions[index];
      document.getElementById('modalTitle').textContent = 'Edit Question';
      document.getElementById('modalQuestionText').value = q.text || q.question;
      
      // Clear existing options
      const optionsContainer = document.getElementById('modalOptions');
      optionsContainer.innerHTML = '';
      
      q.options.forEach((opt, optIdx) => {
        const div = document.createElement('div');
        div.className = 'option-input-group';
        div.innerHTML = `
          <input type="text" class="option-input" value="${opt}" placeholder="Option ${optIdx + 1}">
          <input type="radio" name="correctOption" value="${optIdx}" ${optIdx === q.correct ? 'checked' : ''}>
        `;
        optionsContainer.appendChild(div);
      });
      
      document.getElementById('questionModal').style.display = 'flex';
    }

    function addOptionInput() {
      const container = document.getElementById('modalOptions');
      const count = container.children.length;
      const div = document.createElement('div');
      div.className = 'option-input-group';
      div.innerHTML = `
        <input type="text" class="option-input" placeholder="Option ${count + 1}">
        <input type="radio" name="correctOption" value="${count}">
      `;
      container.appendChild(div);
    }

    async function saveQuestion() {
      const text = document.getElementById('modalQuestionText').value.trim();
      if (!text) {
        alert('Please enter question text');
        return;
      }

      const optionInputs = document.querySelectorAll('.option-input');
      const options = Array.from(optionInputs).map(inp => inp.value.trim()).filter(o => o);
      
      if (options.length < 2) {
        alert('Please add at least 2 options');
        return;
      }

      const correctIndex = parseInt(document.querySelector('input[name="correctOption"]:checked')?.value || '0');

      const questionData = {
        text,
        options,
        correct: correctIndex
      };

      try {
        const token = authToken;
        
        if (editingQuestionIndex !== null) {
          // Update existing question
          const res = await fetch(`/api/quiz/${quizCode}/question/${editingQuestionIndex}`, {
            method: 'PUT',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(questionData)
          });

        if (res.ok) {
          await loadQuiz();
          closeModal();
          // Server/WebSocket will handle broadcasting
        } else {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Failed to update question');
        }
      } else {
        // Add new question
        const res = await fetch(`/api/quiz/${quizCode}/question`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(questionData)
        });

        if (res.ok) {
          await loadQuiz();
          closeModal();
          // Server/WebSocket will handle broadcasting
        } else {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Failed to add question');
        }
        }
      } catch (error) {
        console.error('Error saving question:', error);
        alert('Failed to save question');
      }
    }

    async function deleteQuestion(index) {
      if (!confirm(`Delete question ${index + 1}?`)) return;

      try {
        const token = authToken;
        const res = await fetch(`/api/quiz/${quizCode}/question/${index}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (res.ok) {
          questions.splice(index, 1);
          renderQuestions();
          // Server will broadcast via WebSocket
        } else {
          alert('Failed to delete question');
        }
      } catch (error) {
        console.error('Error deleting question:', error);
        alert('Failed to delete question');
      }
    }

    async function endQuiz() {
      if (!confirm('Are you sure you want to end the quiz? This will close the quiz for all students.')) return;

      try {
        const token = authToken;
        const res = await fetch(`/api/quiz/${quizCode}/end`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (res.ok) {
          socket.emit('endQuiz', { code: quizCode, token: authToken });
          alert('Quiz ended successfully!');
          setTimeout(() => {
            location.href = 'teacher-dashboard.html';
          }, 2000);
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to end quiz');
        }
      } catch (error) {
        console.error('Error ending quiz:', error);
        alert('Failed to end quiz');
      }
    }

    function closeModal() {
      document.getElementById('questionModal').style.display = 'none';
    }

    function updateStats() {
      document.getElementById('participantsCount').textContent = participantCount;
      const totalResponses = responses.total || 0;
      document.getElementById('responsesCount').textContent = totalResponses;
    }

    function renderParticipantsList() {
      const list = document.getElementById('participantsList');
      if (!list) return;
      
      if (liveParticipants.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">No participants yet.</p>';
        return;
      }

      list.innerHTML = liveParticipants.map((p, index) => `
        <div style="display:flex; justify-content:space-between; padding:12px; background:#f8f9ff; border-radius:12px; border:1px solid #e0e0e0;">
          <span><strong>${index + 1}.</strong> ${p.name || 'Anonymous'}</span>
          <span style="color:#8b46ff; font-weight:bold;">Active</span>
        </div>
      `).join('');
    }

    async function loadLeaderboard() {
      try {
        if (!authToken) return;
        const res = await fetch(`/api/quiz/${quizCode}/leaderboard`, {
          headers: { 'Authorization': 'Bearer ' + authToken }
        });
        if (res.ok) {
          liveLeaderboard = await res.json();
          renderScoreboard();
        }
      } catch (error) {
        console.error('Error loading leaderboard:', error);
      }
    }

    function renderScoreboard() {
      const list = document.getElementById('scoreboardList');
      if (!list) return;
      if (!liveLeaderboard || liveLeaderboard.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">No answers yet.</p>';
        return;
      }

      list.innerHTML = liveLeaderboard.map((entry, index) => `
        <div class="scoreboard-row ${index === 0 ? 'top' : ''}">
          <span><strong>#${index + 1}</strong> ${entry.name}</span>
          <span style="color:#10b981; font-weight:bold;">${entry.score} pts</span>
        </div>
      `).join('');
    }


    window.addEventListener('load', async () => {
      if (!quizCode) {
        alert('Invalid quiz code');
        location.href = 'teacher-dashboard.html';
        return;
      }
      
      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/quiz/${quizCode}/data`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (!res.ok) {
          alert('Quiz not found or you do not have access');
          location.href = 'teacher-dashboard.html';
          return;
        }
        
        await loadQuiz();
      } catch (error) {
        console.error('Error loading quiz:', error);
        alert('Error loading quiz');
        location.href = 'teacher-dashboard.html';
      }
    });
  </script>
</body>
</html>
