input {
  http {
    port => 5000
    codec => json
  }
  
  tcp {
    port => 5001
    codec => json_lines
  }
}

filter {
  if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
  }
  
  if [message] {
    mutate {
      add_field => { "log_message" => "%{message}" }
    }
  }
  
  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }
  
  date {
    match => [ "@timestamp", "ISO8601" ]
  }
  
  mutate {
    remove_field => [ "host" ]
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "livequiz-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}

